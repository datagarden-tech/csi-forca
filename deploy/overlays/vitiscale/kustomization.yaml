apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared production configuration for Vitiscale-backed deployments.
# Kubernetes-version overlays inherit this layer and add compatibility labels.
resources:
  - ../../base

patches:
  - path: patch-controller-deployment.yaml
    target:
      kind: Deployment
      name: csi-forca-controller
  - path: patch-node-daemonset.yaml
    target:
      kind: DaemonSet
      name: csi-forca-node
