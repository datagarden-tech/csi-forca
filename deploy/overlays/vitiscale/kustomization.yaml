apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Canonical Vitiscale production configuration (ADR-0017 §7).
# Rendered as the universal 1.1.x bundle dist/deploy.yaml (make kustomize-build)
# and inherited by environment overlays such as test-cluster. Do not add
# Kubernetes-version overlays or labels on top of this layer.
resources:
  - ../../base

patches:
  - path: patch-controller-deployment.yaml
    target:
      kind: Deployment
      name: csi-forca-controller
  - path: patch-node-daemonset.yaml
    target:
      kind: DaemonSet
      name: csi-forca-node
