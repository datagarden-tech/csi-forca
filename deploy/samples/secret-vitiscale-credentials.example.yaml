# Example only. Replace placeholders and keep real credentials out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: vitiscale-credentials
  namespace: csi-forca-system
  labels:
    app.kubernetes.io/name: csi-forca
    app.kubernetes.io/part-of: csi-forca
type: Opaque
stringData:
  # Base URL only. The driver appends /api paths; do not add a trailing /api.
  endpoint: "https://vitiscale.example.com"
  username: "YOUR_USERNAME"
  password: "YOUR_PASSWORD"
  # Instead of username/password, token authentication may be used:
  # api-token: "YOUR_API_TOKEN"
